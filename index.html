<!DOCTYPE html>
<html lang="zh-CN" data-theme="fresh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#059669">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<title>记账本</title>
<script>
try {
  var th = localStorage.getItem("pref_theme");
  if (th === "warm" || th === "dark" || th === "fresh" || th === "forest") document.documentElement.setAttribute("data-theme", th);
  if (localStorage.getItem("pref_lang") === "en") document.documentElement.lang = "en";
} catch (e) {}
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div id="boot" class="boot" aria-hidden="true">💰</div>
<div id="auth" class="auth hidden">
  <div class="auth-card">
    <div class="logo" aria-hidden="true">💰</div>
    <h1 data-i18n="appName">记账本</h1>
    <p class="tagline" data-i18n="tagline">一起记账，清清楚楚</p>
    <div class="lang-switch" id="auth-lang">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <div class="themes auth-themes" id="auth-theme">
      <button type="button" class="theme-opt" data-theme-pick="fresh"><i class="swatch fresh"></i></button>
      <button type="button" class="theme-opt" data-theme-pick="warm"><i class="swatch warm"></i></button>
      <button type="button" class="theme-opt" data-theme-pick="forest"><i class="swatch forest"></i></button>
      <button type="button" class="theme-opt" data-theme-pick="dark"><i class="swatch dark"></i></button>
    </div>
    <input id="au-email" type="email" data-i18n-placeholder="email" placeholder="邮箱" autocomplete="username">
    <input id="au-name" type="text" data-i18n-placeholder="nickname" placeholder="昵称（注册时填写）" class="hidden" autocomplete="nickname" maxlength="40">
    <input id="au-pass" type="password" data-i18n-placeholder="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <button id="au-submit" class="btn primary" type="button">登录</button>
    <div class="row-links"><a id="au-toggle" href="#">没有账号？注册</a><a id="au-reset" href="#">忘记密码</a></div>
    <p id="au-msg" class="msg"></p>
  </div>
</div>
<div id="main" class="hidden">
  <header class="topbar">
    <button id="me-btn" class="me-btn" type="button"></button>
    <button id="ws-btn" class="ws-btn" type="button">账本 ▾</button>
    <span class="top-balance" aria-hidden="true"></span>
  </header>
  <div id="invites"></div>
  <section id="page-home" class="page">
    <div id="no-ws" class="card hidden">
      <h2 data-i18n="noWsYet">还没有自己的账本</h2>
      <p class="muted" data-i18n="noWsHint">可以新建一个，或接受上面的邀请。</p>
      <button id="create-own" class="btn primary block" type="button" data-i18n="createOwn">创建我的账本</button>
    </div>
    <div class="card hero">
      <div class="month-bar"><button id="m-prev" type="button" data-i18n-aria="prevMonth">‹</button><span id="m-label"></span><button id="m-next" type="button" data-i18n-aria="nextMonth">›</button></div>
      <div class="total"><span data-i18n="monthSpend">本月支出</span><b id="m-total">¥0.00</b><em id="m-code">CNY</em></div>
    </div>
    <div class="card filter-card">
      <div class="filter-bar">
        <input id="flt-q" type="search" data-i18n-placeholder="searchRemark" placeholder="搜索备注" enterkeyhint="search">
        <button id="filter-toggle" type="button" class="btn small"><span data-i18n="filter">筛选</span> <b id="filter-n"></b></button>
        <button id="filter-clear" type="button" class="btn small hidden" data-i18n="clearFilters">清除</button>
      </div>
      <div id="filters" class="filters hidden">
        <div class="filter-grid">
          <label><span data-i18n="typeLabel">收支</span><select id="flt-type"></select></label>
          <label><span data-i18n="category">分类</span><select id="flt-cat"></select></label>
          <label><span data-i18n="card">银行卡</span><select id="flt-card"></select></label>
          <label><span data-i18n="chartMember">成员</span><select id="flt-mem"></select></label>
          <label><span data-i18n="fromDate">开始日期</span><input id="flt-from" type="date"></label>
          <label><span data-i18n="toDate">结束日期</span><input id="flt-to" type="date"></label>
        </div>
      </div>
      <p id="filter-sum" class="muted hidden"></p>
    </div>
    <div id="exp-list"></div>
  </section>
  <section id="page-funds" class="page hidden">
    <div class="sec-head"><h2 data-i18n="fundsTitle">存款 · Tabung</h2></div>
    <div id="fund-list"></div>
  </section>
  <section id="page-report" class="page hidden">
    <div class="card hero rep-hero">
      <div class="month-bar"><button id="r-prev" type="button" data-i18n-aria="prevMonth">‹</button><span id="r-label"></span><button id="r-next" type="button" data-i18n-aria="nextMonth">›</button></div>
      <div id="rep-summary"></div>
    </div>
    <div id="rep-budget" class="card budget-card hidden"></div>
    <div class="card">
      <b class="sec-title" data-i18n="breakdown">这个月花在哪里</b>
      <div class="seg" id="chart-mode">
        <button type="button" data-m="cat" class="on" data-i18n="chartCat">分类</button>
        <button type="button" data-m="card" data-i18n="chartCard">银行卡</button>
        <button type="button" data-m="member" data-i18n="chartMember">成员</button>
      </div>
      <div class="chart-wrap"><canvas id="pie"></canvas><p id="chart-empty" class="muted empty-chart hidden"></p></div>
      <div id="legend" class="legend"></div>
    </div>
    <div class="card">
      <div class="sec-head"><b class="sec-title" data-i18n="catTrend">分类变化</b><button id="rep-cat-filter" type="button" class="btn small"><span data-i18n="filter">筛选</span> <b></b></button></div>
      <p class="muted" data-i18n="catTrendHint">最近 6 个月每个分类花了多少</p>
      <div id="rep-cat-chips" class="chips hidden"></div>
      <div class="chart-wrap wide"><canvas id="cat-trend"></canvas><p id="cat-trend-empty" class="muted empty-chart hidden" data-i18n="emptyChart">这个月还没有支出</p></div>
      <div id="rep-cat-table" class="ct-table"></div>
    </div>
    <div class="card">
      <b class="sec-title" data-i18n="trendTitle">近 6 个月</b>
      <div class="chart-wrap wide"><canvas id="trend-chart"></canvas></div>
    </div>
  </section>
  <section id="page-settings" class="page hidden"><div id="settings"></div></section>
  <div id="fan" class="fan" aria-hidden="true">
    <div class="fan-items">
      <button type="button" class="fan-btn" id="fan-expense"><span class="fan-ico">🧾</span><span class="fan-t" data-i18n="fanExpense">消费</span><small data-i18n="fanExpenseSub">支出或收入</small></button>
      <button type="button" class="fan-btn" id="fan-fund"><span class="fan-ico">🐷</span><span class="fan-t" data-i18n="fanFund">存款</span><small data-i18n="fanFundSub">Tabung 存入或新目标</small></button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <span class="tab-spot" id="tab-spot" aria-hidden="true"></span>
    <button type="button" data-p="home" class="on"><span class="tab-ico" aria-hidden="true">🏠</span><span data-i18n="tabHome">首页</span></button>
    <button type="button" data-p="funds"><span class="tab-ico" aria-hidden="true">🐷</span><span data-i18n="tabFunds">存款</span></button>
    <div class="tab-mid"><button id="fab" class="fab" type="button" aria-expanded="false" aria-controls="fan"><span class="fab-plus" aria-hidden="true"></span></button></div>
    <button type="button" data-p="report"><span class="tab-ico" aria-hidden="true">📊</span><span data-i18n="tabReport">报表</span></button>
    <button type="button" data-p="settings"><span class="tab-ico" aria-hidden="true">⚙️</span><span data-i18n="tabSettings">设置</span></button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
